          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # Detección de apps de navegación instaladas (FM-17).
        LSApplicationQueriesSchemes: [comgooglemaps, waze]

  FuelMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FuelMapTests
      # `SKTestSession(configurationFileNamed:)` resuelve el .storekit desde los
      # recursos del bundle de tests, no desde la raíz del repo. Solo en tests: la
      # app nunca lo embebe (PREMIUM-001).
      - path: FuelMap.storekit
        buildPhase: resources
    dependencies:
      # Solo el host app: TCA llega transitivamente. Re-enlazar el paquete
      # estático aquí provoca undefined symbols de CasePathsCore/PerceptionCore.
      - target: FuelMap
      # StoreKitTest: `SKTestSession` ejercita compra/reembolso contra StoreKit real
      # sobre FuelMap.storekit (PREMIUM-001). Framework del SDK, no del host app.
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FuelMap:
    build:
      targets:
        FuelMap: all
        FuelMapTests: [test]
    # StoreKit local: permite comprar/cancelar/reembolsar en simulador sin App Store
    # Connect ni PLA. Debe vivir aquí: el .xcodeproj es generado y un ajuste hecho a
    # mano en el scheme se perdería en el siguiente `xcodegen generate` (PREMIUM-001).
    run:
      storeKitConfiguration: FuelMap.storekit
    test:
      targets:
        - FuelMapTests
