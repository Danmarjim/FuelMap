name: FuelMap

options:
  bundleIdPrefix: com.danmarjim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.15.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "2.7.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  FuelMap:
    type: application
    platform: iOS
    sources:
      - path: FuelMap
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmarjim.fuelmap
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: FuelMap/Info.plist
      properties:
        CFBundleDisplayName: FuelMap
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Base italiano; l10n del Info.plist (es/en) → FM-14.
        NSLocationWhenInUseUsageDescription: "FuelMap usa la tua posizione per mostrarti i distributori più vicini e i loro prezzi."
        NSUserTrackingUsageDescription: "Usiamo un identificatore del dispositivo per mostrarti annunci più pertinenti."
        # ID de app de TEST de Google (sin cuenta AdMob real). Real → FM-14.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511

  FuelMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FuelMapTests
    dependencies:
      # Solo el host app: TCA llega transitivamente. Re-enlazar el paquete
      # estático aquí provoca undefined symbols de CasePathsCore/PerceptionCore.
      - target: FuelMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FuelMap:
    build:
      targets:
        FuelMap: all
        FuelMapTests: [test]
    test:
      targets:
        - FuelMapTests
