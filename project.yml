name: FuelMap

options:
  bundleIdPrefix: com.danmarjim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Recomendados por Xcode (validate settings) para un proyecto localizado:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Firma (para dispositivo/TestFlight). Requiere haber aceptado el PLA en la cuenta Apple.
    DEVELOPMENT_TEAM: HLC2ZTTHKH
    CODE_SIGN_STYLE: Automatic

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.15.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "2.7.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  FuelMap:
    type: application
    platform: iOS
    sources:
      - path: FuelMap
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmarjim.fuelmap
        TARGETED_DEVICE_FAMILY: "1"
        # Solo simulador: los builds headless firman ad-hoc y sin entitlements, y
        # StoreKit responde `notEntitled` (ni productos ni compras, tampoco con
        # SKTestSession). En device/TestFlight los inyecta el provisioning profile,
        # así que no se pisan aquí (PREMIUM-001).
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: FuelMap/FuelMap.entitlements
        # IDs de TEST de Google en Debug siempre (nunca reportar tráfico de desarrollo
        # a la cuenta AdMob real); reales de producción en Release (cuenta AdMob
        # creada 2026-09-01, RELEASE-001 F2). Única fuente de verdad para la
        # bifurcación Debug/Release — `AdClient.swift` los lee del Info.plist en vez
        # de tener su propio `#if DEBUG` (evita que un tercer config, ej. Beta, quede
        # con unidades reales bajo un App ID de test o viceversa; review F1-F2 A-4).
        GAD_APPLICATION_IDENTIFIER: ca-app-pub-3940256099942544~1458002511
        GAD_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2934735716
        GAD_DETAIL_UNIT_ID: ca-app-pub-3940256099942544/2934735716
      configs:
        Release:
          GAD_APPLICATION_IDENTIFIER: ca-app-pub-6310894186551423~8828201061
          GAD_BANNER_UNIT_ID: ca-app-pub-6310894186551423/4014858083
          GAD_DETAIL_UNIT_ID: ca-app-pub-6310894186551423/9555141528
    info:
      path: FuelMap/Info.plist
      properties:
        CFBundleDisplayName: FuelMap
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Base italiano; l10n del Info.plist (es/en) → FM-14.
        NSLocationWhenInUseUsageDescription: "FuelMap usa la tua posizione per mostrarti i distributori più vicini e i loro prezzi."
        NSUserTrackingUsageDescription: "Usiamo un identificatore del dispositivo per mostrarti annunci più pertinenti."
        GADApplicationIdentifier: $(GAD_APPLICATION_IDENTIFIER)
        # Claves propias (no las lee el SDK de Google, las lee `AdClient.swift` vía
        # `Bundle.main.object(forInfoDictionaryKey:)`) — RELEASE-001 F2 / review A-4.
        FuelMapBannerAdUnitID: $(GAD_BANNER_UNIT_ID)
        FuelMapDetailAdUnitID: $(GAD_DETAIL_UNIT_ID)
        # Requerido por Apple para attribution de ads (iOS 14+). Lista de Google para
        # AdMob (developers.google.com/admob/ios/ios14, consultada 2026-09-01) — se
        # necesita completa aunque la app no use mediation propia, porque AdMob sirve
        # demanda de terceros vía Open Bidding (review A-2). Revisar periódicamente
        # por si Google añade identificadores nuevos.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
