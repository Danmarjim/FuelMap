# SwiftLint config — FuelMap
# Permite identificadores cortos legítimos (id, marcas Q8/IP y tokens del design system).
identifier_name:
  excluded:
    - id
    - q8
    - ip
    # Design system tokens (escala de espaciado / radios / elevación)
    - s1
    - s2
    - s3
    - s4
    - s5
    - s6
    - s7
    - s8
    - s9
    - sm
    - md
    - lg
    - xl
    - e1
    - e2
    - e3
