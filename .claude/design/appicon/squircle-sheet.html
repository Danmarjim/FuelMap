<!doctype html>
<meta charset="utf-8">
<style>
  body { margin:0; padding:24px; background:#8E8E93; font:13px -apple-system,sans-serif; color:#fff; }
  .row { display:flex; align-items:flex-end; gap:20px; margin-bottom:26px; }
  .lbl { width:96px; font-weight:700; }
  .ic { border-radius:22.37%; overflow:hidden; background:#fff; flex:none; }
  .ic img { width:100%; height:100%; display:block; }
  .cap { font-size:10px; text-align:center; opacity:.85; margin-top:4px; }
  .cell { flex:none; }
</style>
<body>
<div id="out"></div>
<script>
  const icons = [
    ["G2 Bold + rejilla ★ (elegido)","icon-colonnina-bold.svg"],
    ["G2f Bold plano","icon-colonnina-bold-flat.svg"],
    ["G1 Claro + rejilla","icon-colonnina.svg"],
    ["G1f Claro plano","icon-colonnina-flat.svg"]
  ];
  const sizes = [180, 120, 80, 60, 40];
  let h = "";
  for (const [name, file] of icons) {
    h += `<div class="row"><div class="lbl">${name}</div>`;
    for (const s of sizes) {
      h += `<div class="cell"><div class="ic" style="width:${s}px;height:${s}px"><img src="${file}"></div><div class="cap">${s}</div></div>`;
    }
    h += `</div>`;
  }
  document.getElementById("out").innerHTML = h;
</script>
</body>
